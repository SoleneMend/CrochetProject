<div class="stitch-page">

  <header class="stitch-header">
    <h1>{{ content.abbreviation }} : {{ content.name }}</h1>
  </header>

  <main class="stitch-content">

    @if (content.video) {
      <a class="video-btn" [href]="content.video" target="_blank" rel="noopener">
        ▶ Voir la vidéo
      </a>
    }

    <div class="steps-grid">
      @for (step of content.steps; track $index) {
        <section class="card">
          <h3>Étape {{ $index + 1 }}</h3>

          <p>{{ step.description }}</p>

          @if (step.img) {
            <img [src]="step.img" [alt]="'Étape ' + ($index + 1)">
          }
        </section>
      }
    </div>

  </main>
</div>
